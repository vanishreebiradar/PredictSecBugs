
name: PredictSecBugs CI

on:
  push:
  pull_request:

jobs:
  test-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install pandas numpy scikit-learn joblib streamlit

      - name: Check Python files
        run: |
          python -m py_compile app.py
          python -m py_compile test_model.py
          python -m compileall extraction

      - name: Check model files
        id: model_files
        shell: bash
        run: |
          if [ -f random_forest_model.pkl ] && [ -f preprocessor.pkl ] && [ -f aprrentissage/read.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Model files or dataset are unavailable; prediction test will be skipped."
          fi

      - name: Run model test
        if: steps.model_files.outputs.available == 'true'
        run: python test_model.py

      - name: CI check completed
        run: echo "PredictSecBugs CI checks completed"
